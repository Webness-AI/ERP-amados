services:
  - type: web
    name: erp-amados-backend
    env: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: "10"
      - key: CORS_ORIGIN
        sync: false
      - key: DASHBOARD_ALERTS_SCHEDULER_ENABLED
        value: "true"
      - key: DASHBOARD_ALERTS_REFRESH_EVERY_MINUTES
        value: "15"
      - key: DASHBOARD_ALERTS_RUN_ON_STARTUP
        value: "true"
