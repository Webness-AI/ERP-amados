version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: erp_amados_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: erp_amados

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: erp_amados_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      - mongo
    environment:
      NODE_ENV: development
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/erp_amados
      JWT_ACCESS_SECRET: change-me-access-secret
      JWT_REFRESH_SECRET: change-me-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_SALT_ROUNDS: "10"
      CORS_ORIGIN: "http://localhost:5173,http://localhost:5174"
    volumes:
      - ./backend/src:/app/src
      - /app/node_modules

volumes:
  mongo_data:
